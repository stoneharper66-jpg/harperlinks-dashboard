<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Set a new password — HarperLinks</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F6F8FC" />
<link rel="stylesheet" href="app.css" />
<style>
  .gate{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(10,109,216,.08), transparent 60%),
      radial-gradient(900px 500px at 95% 110%, rgba(216,27,114,.06), transparent 60%),
      var(--bg, #F6F8FC)}
  .gate-card{width:min(420px,100%);background:var(--panel,#FFFFFF);border:1px solid var(--border,rgba(14,17,22,.1));
    border-radius:20px;padding:34px 30px;box-shadow:0 18px 50px rgba(14,17,22,.10)}
  .gate-brand{display:flex;align-items:center;gap:0;justify-content:center;margin-bottom:6px}
  .gate-brand .logo-word{font-size:21px;letter-spacing:-.01em}
  .gate-brand .logo-glossy{width:46px;height:34px;object-fit:contain;margin-right:-2px;filter:drop-shadow(0 1px 3px rgba(120,60,200,.10))}
  .gate-sub{text-align:center;color:var(--muted,#55606E);font-size:13.5px;margin:0 0 26px}
  .gate-field{margin-bottom:14px}
  .gate-field label{display:block;font-size:12px;color:var(--muted,#55606E);margin-bottom:6px;font-weight:600}
  .gate-field input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border,rgba(14,17,22,.12));
    background:#FFFFFF;color:var(--text,#0E1116);font-size:14.5px;outline:none;transition:border-color .2s}
  .gate-field input:focus{border-color:#0A6DD8;box-shadow:0 0 0 3px rgba(10,109,216,.12)}
  .gate-btn{width:100%;margin-top:8px;padding:13px;border:none;border-radius:12px;cursor:pointer;font-weight:700;font-size:15px;
    color:#fff;background:linear-gradient(120deg,#0A6DD8,#D81B72);transition:opacity .2s,transform .15s}
  .gate-btn:hover{opacity:.92;transform:translateY(-1px)}
  .gate-btn:disabled{opacity:.5;cursor:default;transform:none}
  .gate-err{display:none;margin:0 0 14px;padding:10px 13px;border-radius:10px;font-size:13px;
    background:rgba(214,69,69,.07);border:1px solid rgba(214,69,69,.28);color:#B32626}
  .gate-ok{display:none;margin:0 0 14px;padding:10px 13px;border-radius:10px;font-size:13px;
    background:rgba(31,164,92,.08);border:1px solid rgba(31,164,92,.3);color:#157A43}
</style>
</head>
<body>
<div class="gate">
  <form class="gate-card" id="form" autocomplete="on">
    <div class="gate-brand">
      <img class="logo-glossy" src="/assets/logo-alpha.png" alt="" aria-hidden="true" width="66" height="44" />
      <span class="logo-word">Harper<b>Links</b></span>
    </div>
    <p class="gate-sub">Choose a new password</p>
    <p class="gate-err" id="err"></p>
    <p class="gate-ok" id="ok"></p>
    <div class="gate-field">
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters" />
    </div>
    <div class="gate-field">
      <label for="pw2">Confirm it</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="8" required />
    </div>
    <button class="gate-btn" id="btn" type="submit">Set new password</button>
  </form>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var token = new URLSearchParams(location.search).get("token") || "";

  if (!token) {
    $("err").textContent = "This reset link is missing its code. Request a new one from the sign-in page.";
    $("err").style.display = "block";
    $("btn").disabled = true;
  }

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var err = $("err"), ok = $("ok"), btn = $("btn");
    err.style.display = "none"; ok.style.display = "none";
    if ($("pw").value !== $("pw2").value) {
      err.textContent = "Those two passwords don't match.";
      err.style.display = "block";
      return;
    }
    btn.disabled = true;
    fetch("/api/auth/reset", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token, password: $("pw").value }),
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (out) {
        if (!out.ok) throw new Error(out.d.error || "Couldn't reset — try again.");
        ok.textContent = "Done! Taking you to sign in…";
        ok.style.display = "block";
        setTimeout(function () { location.href = "/login.html"; }, 1400);
      })
      .catch(function (ex) {
        err.textContent = ex.message;
        err.style.display = "block";
        btn.disabled = false;
      });
  });
})();
</script>
</body>
</html>
