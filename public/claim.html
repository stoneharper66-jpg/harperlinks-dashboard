<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Create your account — HarperLinks</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F6F8FC" />
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="app.css" />
<style>
  .gate{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(10,109,216,.08), transparent 60%),
      radial-gradient(900px 500px at 95% 110%, rgba(216,27,114,.06), transparent 60%),
      var(--bg, #F6F8FC)}
  .gate-card{width:min(440px,100%);background:var(--panel,#FFFFFF);border:1px solid var(--border,rgba(14,17,22,.1));
    border-radius:20px;padding:34px 30px;box-shadow:0 18px 50px rgba(14,17,22,.10)}
  .gate-brand{display:flex;align-items:center;gap:0;justify-content:center;margin-bottom:6px}
  .gate-brand .logo-word{font-size:21px;letter-spacing:-.01em}
  .gate-brand .logo-glossy{width:46px;height:34px;object-fit:contain;margin-right:-2px;filter:drop-shadow(0 1px 3px rgba(120,60,200,.10))}
  .gate-sub{text-align:center;color:var(--muted,#55606E);font-size:13.5px;margin:0 0 20px}
  .gate-field{margin-bottom:14px}
  .gate-field label{display:block;font-size:12px;color:var(--muted,#55606E);margin-bottom:6px;font-weight:600}
  .gate-field input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border,rgba(14,17,22,.12));
    background:#FFFFFF;color:var(--text,#0E1116);font-size:14.5px;outline:none;transition:border-color .2s}
  .gate-field input:focus{border-color:#0A6DD8;box-shadow:0 0 0 3px rgba(10,109,216,.12)}
  .gate-field input:disabled{background:#F2F5F9;color:var(--muted,#55606E)}
  .gate-btn{width:100%;margin-top:8px;padding:13px;border:none;border-radius:12px;cursor:pointer;font-weight:700;font-size:15px;
    color:#fff;background:linear-gradient(120deg,#0A6DD8,#D81B72);transition:opacity .2s,transform .15s}
  .gate-btn:hover{opacity:.92;transform:translateY(-1px)}
  .gate-btn:disabled{opacity:.5;cursor:default;transform:none}
  .gate-err{display:none;margin:0 0 14px;padding:10px 13px;border-radius:10px;font-size:13px;
    background:rgba(214,69,69,.07);border:1px solid rgba(214,69,69,.28);color:#B32626}
  .gate-ok{display:none;margin:0 0 14px;padding:10px 13px;border-radius:10px;font-size:13px;
    background:rgba(31,164,92,.08);border:1px solid rgba(31,164,92,.3);color:#157A43}
  /* the plan they actually bought, read off the link */
  .plan-strip{display:flex;align-items:center;gap:10px;margin:0 0 20px;padding:12px 14px;border-radius:13px;
    background:linear-gradient(120deg,rgba(10,109,216,.07),rgba(216,27,114,.05));border:1px solid rgba(10,109,216,.18)}
  .plan-strip .tick{width:22px;height:22px;flex:none;border-radius:99px;background:#17A673;color:#fff;
    font-size:12px;line-height:22px;text-align:center;font-weight:700}
  .plan-strip b{display:block;font-size:14px;color:var(--text,#0E1116)}
  .plan-strip span{font-size:12px;color:var(--muted,#55606E)}
  .gate-foot{text-align:center;font-size:12.5px;color:var(--muted,#55606E);margin:16px 0 0}
  .gate-foot a{color:#0A6DD8;text-decoration:none}
  #loading{text-align:center;color:var(--muted,#55606E);font-size:14px;padding:18px 0}
</style>
</head>
<body>
<div class="gate">
  <form class="gate-card" id="form" autocomplete="on" hidden>
    <div class="gate-brand">
      <img class="logo-glossy" src="/assets/logo-alpha.png" alt="" aria-hidden="true" width="66" height="44" />
      <span class="logo-word">Harper<b>Links</b></span>
    </div>
    <p class="gate-sub" id="sub">One step left</p>

    <div class="plan-strip" id="planStrip">
      <span class="tick">✓</span>
      <div><b id="planName">Your plan</b><span id="planSub"></span></div>
    </div>

    <p class="gate-err" id="err"></p>
    <p class="gate-ok" id="ok"></p>

    <div class="gate-field">
      <label for="email">Email</label>
      <input id="email" type="email" disabled />
    </div>
    <div class="gate-field">
      <label for="name">Your name</label>
      <input id="name" type="text" autocomplete="name" required placeholder="Jane Smith" />
    </div>
    <div class="gate-field">
      <label for="business">Business name</label>
      <input id="business" type="text" autocomplete="organization" placeholder="Jane's Flowers" />
    </div>
    <div class="gate-field">
      <label for="pw">Choose a password</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters" />
    </div>
    <button class="gate-btn" id="btn" type="submit">Create my account</button>
    <p class="gate-foot">Already set up? <a href="/login.html">Sign in</a></p>
  </form>

  <div class="gate-card" id="deadCard" hidden>
    <div class="gate-brand">
      <img class="logo-glossy" src="/assets/logo-alpha.png" alt="" aria-hidden="true" width="66" height="44" />
      <span class="logo-word">Harper<b>Links</b></span>
    </div>
    <p class="gate-err" id="deadErr" style="display:block"></p>
    <p class="gate-foot"><a href="/login.html">Go to sign in</a></p>
  </div>

  <div id="loading">Checking your link…</div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  // Two ways in: the token we emailed, or the Stripe checkout session id that
  // Stripe itself appends to the success URL. Either proves the purchase, so
  // nobody is locked out just because email isn't sending.
  var token = q.get("token") || "";
  var session = q.get("session") || q.get("session_id") || "";

  var PLAN_LABEL = { professional: "Professional", business: "Business", enterprise: "Enterprise" };
  var PLAN_PRICE = { professional: "A$249/month", business: "A$499/month", enterprise: "A$999/month" };

  function dead(msg) {
    $("loading").hidden = true;
    $("form").hidden = true;
    $("deadCard").hidden = false;
    $("deadErr").textContent = msg;
  }

  if (!token && !session) {
    dead("This link is missing its code. Use the full link from your email, or message us and we'll send a fresh one.");
    return;
  }

  var qs = token ? "token=" + encodeURIComponent(token) : "session=" + encodeURIComponent(session);

  fetch("/api/claim?" + qs)
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (out) {
      if (!out.ok) return dead(out.d.error || "We couldn't check that link.");
      var c = out.d.claim;
      $("loading").hidden = true;
      $("form").hidden = false;
      $("email").value = c.email;
      if (c.name) $("name").value = c.name;
      if (c.business) $("business").value = c.business;
      $("planName").textContent = (PLAN_LABEL[c.plan] || c.plan) + " plan — paid";
      $("planSub").textContent = (PLAN_PRICE[c.plan] || "") + (c.trialing ? " · your 7-day free trial has started" : "");
      $("sub").textContent = "Choose a password and you're in.";
      (c.name ? $("business") : $("name")).focus();
    })
    .catch(function () { dead("We couldn't reach the server. Try again in a moment."); });

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var err = $("err"), ok = $("ok"), btn = $("btn");
    err.style.display = "none"; ok.style.display = "none";
    btn.disabled = true; btn.textContent = "Creating…";

    fetch("/api/claim", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        token: token, session: session,
        name: $("name").value, business: $("business").value, password: $("pw").value,
      }),
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (out) {
        if (!out.ok) throw new Error(out.d.error || "Couldn't create the account — try again.");
        ok.textContent = "You're in. Taking you to your dashboard…";
        ok.style.display = "block";
        // the POST signed them in, so this lands them straight inside
        setTimeout(function () { location.href = "/app"; }, 900);
      })
      .catch(function (ex) {
        err.textContent = ex.message;
        err.style.display = "block";
        btn.disabled = false; btn.textContent = "Create my account";
      });
  });
})();
</script>
</body>
</html>
